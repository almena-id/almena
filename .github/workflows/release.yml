# Builds the almena binary for Linux, macOS and Windows whenever something is
# merged into main, and publishes it as a GitHub release of almena-id/almena.
#
# Versions are year.month.sequence (e.g. 2026.10.1), as in the mediator: the
# sequence starts at 1 each month and goes up by one per publication. It is
# worked out from the git tags v<year>.<month>.<n>, and the release (with its
# tag) is created only once every binary is built, so a failed build does not
# use up a number. Runs queue up (never in parallel), so two merges cannot
# take the same number.
#
# The version is compiled into the binary (ALMENA_VERSION): `almena --version`
# reports it. Cargo.toml keeps a SemVer version of its own, because Cargo
# refuses the leading zero of the month (2026.09.1 is not valid SemVer).
#
# Each target builds on its own runner, in parallel. The release holds one
# archive per target, SHA256SUMS and its signature:
#
#   almena-<version>-x86_64-unknown-linux-gnu.tar.gz    Linux x86_64 (Ubuntu 24.04+)
#   almena-<version>-aarch64-apple-darwin.tar.gz        macOS Apple silicon
#   almena-<version>-x86_64-pc-windows-msvc.zip         Windows x86_64
#   SHA256SUMS                                          every file's checksum
#   SHA256SUMS.asc                                      its OpenPGP signature
#
# What vouches for each binary:
#
#   macOS     signed with Developer ID under the hardened runtime and
#             notarized by Apple (a bare executable takes no stapled ticket;
#             Gatekeeper looks it up online)
#   Windows   Authenticode, through Azure Trusted Signing
#   Linux     SHA256SUMS.asc, by the Almena release key
#
# The secrets and variables are the organization's, shared with the wallet;
# how each one is obtained is in the wallet's docs/releasing.md.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next year.month.sequence
        id: next
        run: |
          month=$(date -u +%Y.%m)
          last=$(git tag --list "v${month}.*" | sed "s/^v${month}\.//" | grep -E '^[0-9]+$' | sort -n | tail -n 1)
          version="${month}.$(( ${last:-0} + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [version, check]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ALMENA_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the version it reports
        run: |
          reported=$("target/${{ matrix.target }}/release/almena" --version)
          echo "$reported"
          test "$reported" = "almena $ALMENA_VERSION"

      # ----- macOS: Developer ID, hardened runtime, notarized ------------------

      - name: Signing keychain
        if: runner.os == 'macOS'
        # A keychain of its own for this run, holding the Developer ID
        # Application certificate and the intermediate it chains to.
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)
          test -n "$identity" || { echo "No Developer ID Application identity in MACOS_CERTIFICATE_P12." >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Sign and notarize
        if: runner.os == 'macOS'
        # The hardened runtime is what notarization asks for; the CLI needs no
        # entitlement to run under it. A bare executable cannot have the ticket
        # stapled to it (only an app, a disk image or an installer can), so
        # Gatekeeper fetches it from Apple the first time a quarantined copy
        # runs. Apple notarizes a zip, not a tarball: the binary goes up zipped
        # and the same signed binary is what the tarball carries.
        env:
          NOTARY_KEY: ${{ secrets.ASC_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.ASC_API_ISSUER_ID }}
        run: |
          binary="target/${{ matrix.target }}/release/almena"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/almena.zip"
          xcrun notarytool submit "$RUNNER_TEMP/almena.zip" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" --wait --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            exit 1
          fi
          rm -f "$key" "$RUNNER_TEMP/almena.zip"

      # ----- Windows: Authenticode -----------------------------------------------

      - name: Sign
        if: runner.os == 'Windows'
        # Azure Trusted Signing: the certificate never leaves Microsoft's HSM;
        # it signs the digest and stamps it with Microsoft's timestamp service.
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          trusted-signing-cli -e "$ENDPOINT" -a "$ACCOUNT" -c "$PROFILE" -d almena \
            "target/${{ matrix.target }}/release/almena.exe"

      - name: Check the signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "target/${{ matrix.target }}/release/almena.exe"
          "{0} ({1})" -f $signature.Status, $signature.SignerCertificate.Subject
          if ($signature.Status -ne 'Valid') { exit 1 }

      - name: Package
        run: |
          name="almena-${ALMENA_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/almena.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/almena" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: almena-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      # The release and its version tag.
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: almena-*
          merge-multiple: true

      - name: Checksums and their signature
        # Linux has no notarization: every download, the Linux one included, is
        # vouched for by the checksums' OpenPGP signature.
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Create the release and tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "almena $VERSION" \
            --generate-notes
