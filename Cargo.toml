[package]
name = "almena"
description = "Command-line client of the Almena ID platform"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "almena"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
